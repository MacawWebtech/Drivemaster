<!DOCTYPE html>

<html data-theme="light" lang="en" dir="ltr">
<head><script>try{document.documentElement.dir=localStorage.getItem('drivemaster-direction')==='rtl'?'rtl':'ltr'}catch(e){document.documentElement.dir='ltr'}</script>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Login / Register – DriveMaster Portal</title>
<meta content="Log in to your DriveMaster student portal to book lessons, track hours, and view instructor feedback." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="assets/css/dark-mode.css" rel="stylesheet"/>
<link href="assets/css/rtl.css" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/dm-enhancements.css">
</head>
<body>
<div class="auth-page">
<div class="auth-display-controls" role="group" aria-label="Display settings">
<button type="button" class="dm-rtl-toggle" data-rtl-toggle aria-label="Switch to right-to-left layout" aria-pressed="false" title="Switch to RTL"><i class="bi bi-text-paragraph" aria-hidden="true"></i></button>
<button aria-label="Toggle dark mode" class="theme-toggle" data-theme-toggle="">
<i class="bi bi-sun-fill icon-sun"></i>
<i class="bi bi-moon-fill icon-moon"></i>
</button>
</div>
<div class="auth-card">
<div class="auth-header">
<a class="logo" href="index.html"><img alt="DriveMaster" class="logo-img" src="assets/images/logo.png"/></a>
<p style="color:var(--text-muted);margin:0;">Student Portal</p>
</div>
<div class="auth-tabs" role="tablist">
<button aria-selected="true" class="auth-tab active" data-auth-tab="login" role="tab" type="button">Login</button>
<button aria-selected="false" class="auth-tab" data-auth-tab="register" role="tab" type="button">Register</button>
</div>
<!-- Login Form -->
<form action="dashboard/index.html" id="login-form" method="GET">
<div class="form-group">
<label class="form-label" for="login-email">Email</label>
<input class="form-input" id="login-email" name="email" placeholder="you@email.com" required="" type="email" value="alex.rivera@email.com"/>
<div class="form-error"></div>
</div>
<div class="form-group">
<label class="form-label" for="login-password">Password</label>
<input class="form-input" id="login-password" minlength="6" name="password" placeholder="••••••••" required="" type="password" value="demo1234"/>
<div class="form-error"></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:0.875rem;">
<label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
<input name="remember" type="checkbox"/> Remember me
          </label>
<a href="#">Forgot password?</a>
</div>
<button class="btn btn-primary w-full btn-lg" type="submit">Sign In</button>

</form>
<!-- Register Form (hidden by default) -->
<form action="#" id="register-form" method="POST" style="display:none;">
<div class="form-group">
<label class="form-label" for="reg-name">Full Name</label>
<input class="form-input" id="reg-name" name="name" placeholder="Your full name" required="" type="text"/>
<div class="form-error"></div>
</div>
<div class="form-group">
<label class="form-label" for="reg-email">Email</label>
<input class="form-input" id="reg-email" name="email" placeholder="you@email.com" required="" type="email"/>
<div class="form-error"></div>
</div>
<div class="form-group">
<label class="form-label" for="reg-phone">Phone</label>
<input class="form-input" id="reg-phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="form-group">
<label class="form-label" for="reg-password">Password</label>
<input class="form-input" id="reg-password" minlength="6" name="password" placeholder="Min. 6 characters" required="" type="password"/>
<div class="form-error"></div>
</div>
<div class="form-group">
<label class="form-label" for="reg-course">Interested Course</label>
<select class="form-select" id="reg-course" name="course">
<option value="">Select...</option>
<option>Four-Wheeler</option>
<option>Two-Wheeler</option>
<option>Not sure yet</option>
</select>
</div>
<button class="btn btn-primary w-full btn-lg" type="submit">Create Account</button>
<div id="register-success" style="display:none;margin-top:1rem;padding:1rem;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);text-align:center;font-size:0.875rem;">
          Account created! Redirecting to dashboard...
        </div>
</form>


</div>
</div>
<script src="assets/js/main.js"></script>
<script>
    // Tab switch: Login / Register
    document.querySelectorAll('[data-auth-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('[data-auth-tab]').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        const isLogin = tab.dataset.authTab === 'login';
        document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
        document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
      });
    });

    // Login → always go to dashboard (demo: no real auth)
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) {
        alert('Please enter email and password.');
        return;
      }
      // Demo: any credentials work → redirect to student dashboard
      window.location.href = 'dashboard/index.html';
    });

    // Register → show success then go to dashboard
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!name || !email || !password || password.length < 6) {
        alert('Please fill all required fields (password min 6 characters).');
        return;
      }
      const success = document.getElementById('register-success');
      if (success) success.style.display = 'block';
      setTimeout(function () {
        window.location.href = 'dashboard/index.html';
      }, 1200);
    });
  </script>
<script src="assets/js/dm-enhancements.js"></script>
</body>
</html>
