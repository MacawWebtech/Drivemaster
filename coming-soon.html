<!DOCTYPE html>

<html data-theme="light" lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Coming Soon – DriveMaster</title>
<meta content="noindex" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="assets/css/dark-mode.css" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/dm-enhancements.css">
</head>
<body>
<main class="error-page" style="background:var(--bg-secondary)">
<div style="max-width:32rem;">
<a class="logo" href="index.html"><img alt="DriveMaster" class="logo-img" src="assets/images/logo.png"/></a>
<h1 style="margin-bottom:0.75rem;">Coming Soon</h1>
<p style="color:var(--text-secondary);margin-bottom:2rem;">
        We're working on something exciting. Leave your email and we'll notify you when we launch.
      </p>
<form data-demo="true" data-validate="" style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center;margin-bottom:1.5rem;">
<div class="form-group" style="margin:0;flex:1;min-width:200px;">
<input aria-label="Email" class="form-input" placeholder="Your email" required="" type="email"/>
<div class="form-error"></div>
</div>
<button class="btn btn-primary" type="submit">Notify Me</button>
</form>
<div data-form-success="" style="display:none;padding:0.75rem;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius);margin-bottom:1rem;">
        Thanks! We'll be in touch. (Demo)
      </div>
<p style="font-size:0.875rem;color:var(--text-muted);">
        Or <a href="contact.html">contact us</a> if you need help now.
      </p>
<button type="button" class="dm-rtl-toggle" data-rtl-toggle aria-label="Switch to right-to-left layout" aria-pressed="false" title="Switch to RTL"><i class="bi bi-text-paragraph" aria-hidden="true"></i></button>
<button aria-label="Toggle dark mode" class="theme-toggle" data-theme-toggle="" style="margin-top:2rem;">
<i class="bi bi-sun-fill icon-sun"></i>
<i class="bi bi-moon-fill icon-moon"></i>
</button>
</div>
</main>
<script src="assets/js/main.js"></script>
<script src="assets/js/dm-enhancements.js"></script>
</body>
</html>
